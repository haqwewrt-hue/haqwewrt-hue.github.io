<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>시간의 기록소 - 룰렛</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  font-family: Arial, sans-serif;

  color: white;

  background:
    radial-gradient(circle at center, #202060, #070718 70%);

  overflow-x: hidden;
}

/* 전체 게임창 */
.game {
  width: 96%;
  max-width: 1000px;

  padding: 35px 25px 45px;

  text-align: center;

  background: rgba(255,255,255,0.08);

  border: 1px solid rgba(255,255,255,0.15);

  border-radius: 35px;

  backdrop-filter: blur(15px);

  box-shadow:
    0 30px 100px rgba(0,0,0,0.6);
}

h1 {
  margin: 0 0 8px;

  font-size: clamp(30px, 5vw, 50px);

  text-shadow:
    0 0 20px #697cff;
}

.subtitle {
  margin-bottom: 25px;

  color: #c8c8e8;
}

/* 룰렛 영역 */
.roulette-area {
  position: relative;

  width: min(80vw, 720px);
  aspect-ratio: 1 / 1;

  margin: 10px auto 25px;
}

/* 룰렛 */
canvas {
  width: 100%;
  height: 100%;

  display: block;
}

/* 화살표 */
.pointer {
  position: absolute;

  left: 50%;
  top: -7px;

  width: 72px;
  height: 125px;

  transform:
    translateX(-50%)
    rotate(0deg);

  transform-origin: 50% 10px;

  z-index: 20;

  transition:
    transform 0.08s cubic-bezier(.2,.8,.2,1);

  filter:
    drop-shadow(0 5px 8px rgba(0,0,0,.55));
}

/* 화살표 몸통 */
.pointer::before {
  content: "";

  position: absolute;

  left: 50%;
  top: 0;

  width: 28px;
  height: 92px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #eeeeee,
      #ffffff,
      #cccccc
    );

  clip-path: polygon(
    50% 0%,
    100% 18%,
    75% 100%,
    50% 85%,
    25% 100%,
    0% 18%
  );

  border-radius: 8px;
}

/* 화살표 위쪽 고정축 */
.pointer::after {
  content: "";

  position: absolute;

  left: 50%;
  top: -7px;

  width: 23px;
  height: 23px;

  transform: translateX(-50%);

  border-radius: 50%;

  background: #fff;

  border: 4px solid #cfcfcf;

  box-shadow:
    0 2px 6px rgba(0,0,0,.5);
}

/* 결과 */
.result {
  min-height: 65px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 25px;
  font-weight: bold;

  color: #ffffff;

  text-shadow:
    0 0 15px #8ea0ff;
}

/* 버튼 */
button {
  padding: 17px 45px;

  border: none;

  border-radius: 40px;

  color: white;

  font-size: 19px;
  font-weight: bold;

  cursor: pointer;

  background:
    linear-gradient(135deg, #697cff, #8b5cff);

  box-shadow:
    0 8px 25px rgba(80,80,255,.35);

  transition: .2s;
}

button:hover {
  transform: scale(1.06);

  box-shadow:
    0 0 35px rgba(105,124,255,.8);
}

button:active {
  transform: scale(.96);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

/* 모바일 */
@media(max-width:600px) {

  .game {
    padding: 25px 10px 35px;
  }

  .pointer {
    transform-origin: 50% 10px;
  }

  button {
    width: 85%;
  }
}
</style>
</head>

<body>

<div class="game">

  <h1>🎰 운명의 룰렛</h1>

  <div class="subtitle">
    마지막까지 어디에 멈출지 아무도 모른다...
  </div>

  <div class="roulette-area">

    <canvas id="roulette"></canvas>

    <div id="pointer" class="pointer"></div>

  </div>

  <div id="result" class="result">
    버튼을 눌러 운명을 결정해봐...
  </div>

  <button id="spinButton">
    🎯 룰렛 돌리기
  </button>

</div>


<script>

/* =========================
   설정
========================= */

const canvas = document.getElementById("roulette");
const ctx = canvas.getContext("2d");

const pointer = document.getElementById("pointer");
const result = document.getElementById("result");
const spinButton = document.getElementById("spinButton");

/*
   여기 숫자만 바꾸면
   2칸부터 30칸까지 가능
*/

const SLOT_COUNT = 30;


/* =========================
   캔버스 설정
========================= */

function resizeCanvas() {

  const size = canvas.clientWidth;

  const dpr = window.devicePixelRatio || 1;

  canvas.width = size * dpr;
  canvas.height = size * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawRoulette();
}

window.addEventListener("resize", resizeCanvas);


/* =========================
   룰렛 변수
========================= */

let rotation = 0;

let spinning = false;

let velocity = 0;

let lastTime = 0;

let lastHitAngle = 0;


/* =========================
   색상
========================= */

const colors = [

  "#ff7272",
  "#3db98b",
  "#3484c4",
  "#ffbd55"

];


/* =========================
   각도 정리
========================= */

function normalizeAngle(angle) {

  angle %= Math.PI * 2;

  if (angle < 0) {
    angle += Math.PI * 2;
  }

  return angle;
}


/* =========================
   룰렛 그리기
========================= */

function drawRoulette() {

  const size = canvas.clientWidth;

  const cx = size / 2;
  const cy = size / 2;

  const radius = size * 0.43;

  ctx.clearRect(0, 0, size, size);


  /* 그림자 */

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius + 20,
    0,
    Math.PI * 2
  );

  ctx.shadowColor = "rgba(0,0,0,.65)";
  ctx.shadowBlur = 35;

  ctx.fillStyle = "#222";

  ctx.fill();

  ctx.restore();


  /* 금색 외곽 */

  const outerGradient =
    ctx.createRadialGradient(
      cx,
      cy,
      radius * .5,
      cx,
      cy,
      radius + 20
    );

  outerGradient.addColorStop(0, "#fff18a");
  outerGradient.addColorStop(.35, "#ffc928");
  outerGradient.addColorStop(.7, "#d88900");
  outerGradient.addColorStop(1, "#ffcf38");


  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius + 18,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = outerGradient;

  ctx.fill();


  /* 룰렛 칸 */

  const slice =
    Math.PI * 2 / SLOT_COUNT;


  for(let i = 0; i < SLOT_COUNT; i++) {

    const start =
      rotation +
      i * slice -
      Math.PI / 2;

    const end =
      start + slice;


    ctx.beginPath();

    ctx.moveTo(cx, cy);

    ctx.arc(
      cx,
      cy,
      radius,
      start,
      end
    );

    ctx.closePath();


    ctx.fillStyle =
      colors[i % colors.length];

    ctx.fill();


    /* 칸 경계 */

    ctx.strokeStyle =
      "rgba(255,255,255,.45)";

    ctx.lineWidth = 2;

    ctx.stroke();


    /* 숫자 */

    const textAngle =
      start + slice / 2;

    const textRadius =
      radius * .73;

    const tx =
      cx +
      Math.cos(textAngle) *
      textRadius;

    const ty =
      cy +
      Math.sin(textAngle) *
      textRadius;


    ctx.save();

    ctx.translate(tx, ty);

    ctx.rotate(textAngle + Math.PI / 2);

    ctx.fillStyle = "white";

    ctx.font =
      `bold ${Math.max(13, size * .035)}px Arial`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = "rgba(0,0,0,.5)";
    ctx.shadowBlur = 4;

    ctx.fillText(
      i + 1,
      0,
      0
    );

    ctx.restore();
  }


  /* 안쪽 원 */

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius * .22,
    0,
    Math.PI * 2
  );

  const centerGradient =
    ctx.createRadialGradient(
      cx - 10,
      cy - 10,
      5,
      cx,
      cy,
      radius * .22
    );

  centerGradient.addColorStop(
    0,
    "#fff3a6"
  );

  centerGradient.addColorStop(
    .4,
    "#d99826"
  );

  centerGradient.addColorStop(
    1,
    "#9b4d13"
  );

  ctx.fillStyle = centerGradient;

  ctx.fill();

  ctx.strokeStyle = "#ffe16b";
  ctx.lineWidth = 3;

  ctx.stroke();


  /* 중앙 버튼 */

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius * .085,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#ff6666";

  ctx.fill();

  ctx.strokeStyle =
    "rgba(255,255,255,.6)";

  ctx.lineWidth = 2;

  ctx.stroke();


  /* 外側の突起 */

  for(let i = 0; i < SLOT_COUNT; i++) {

    const angle =
      rotation +
      i * slice -
      Math.PI / 2;

    const pegRadius =
      radius + 4;


    const px =
      cx +
      Math.cos(angle) *
      pegRadius;

    const py =
      cy +
      Math.sin(angle) *
      pegRadius;


    ctx.beginPath();

    ctx.arc(
      px,
      py,
      Math.max(5, size * .009),
      0,
      Math.PI * 2
    );


    const pegGradient =
      ctx.createRadialGradient(
        px - 2,
        py - 2,
        1,
        px,
        py,
        8
      );

    pegGradient.addColorStop(
      0,
      "#ffffff"
    );

    pegGradient.addColorStop(
      .5,
      "#eeeeee"
    );

    pegGradient.addColorStop(
      1,
      "#a9a9a9"
    );


    ctx.fillStyle = pegGradient;

    ctx.fill();


    ctx.strokeStyle =
      "rgba(100,60,20,.4)";

    ctx.lineWidth = 1;

    ctx.stroke();
  }
}


/* =========================
   화살표 충돌 효과
========================= */

function pointerHit(force) {

  /*
     강하게 충돌할수록
     화살표가 더 많이 꺾임
  */

  const direction =
    Math.random() > .5 ? 1 : -1;

  const angle =
    direction *
    Math.min(
      25,
      7 + force * 7
    );


  pointer.style.transform =
    `translateX(-50%) rotate(${angle}deg)`;


  /* 살짝 기다렸다가 복귀 */

  setTimeout(() => {

    pointer.style.transform =
      `translateX(-50%) rotate(${-angle * .35}deg)`;

    setTimeout(() => {

      pointer.style.transform =
        `translateX(-50%) rotate(0deg)`;

    }, 55);

  }, 70);
}


/* =========================
   충돌 체크
========================= */

function checkPegCollision() {

  /*
     위쪽 화살표 위치 = -90도

     룰렛의 돌기가 이 위치를 지나가면
     화살표를 튕겨준다.
  */

  const slice =
    Math.PI * 2 / SLOT_COUNT;


  const topAngle =
    Math.PI * 1.5;


  for(let i = 0; i < SLOT_COUNT; i++) {

    const pegAngle =
      normalizeAngle(
        rotation +
        i * slice -
        Math.PI / 2
      );


    let difference =
      Math.abs(
        normalizeAngle(
          pegAngle - topAngle
        )
      );


    if(difference > Math.PI) {
      difference =
        Math.PI * 2 - difference;
    }


    /*
       빠를 때는 조금 넓은 충돌 범위,
       느려지면 더 정확하게 걸리게 함
    */

    const hitRange =
      Math.min(
        0.11,
        0.035 +
        Math.abs(velocity) * 0.015
      );


    if(
      difference < hitRange &&
      Math.abs(rotation - lastHitAngle) > slice * .45
    ) {

      lastHitAngle = rotation;

      pointerHit(
        Math.abs(velocity)
      );

      break;
    }
  }
}


/* =========================
   회전 애니메이션
========================= */

function animate(time) {

  if(!spinning) return;


  if(!lastTime) {
    lastTime = time;
  }


  const delta =
    Math.min(
      32,
      time - lastTime
    );

  lastTime = time;


  /*
     회전
  */

  rotation +=
    velocity *
    delta /
    16;


  /*
     부드러운 감속

     처음에는 빠르게
     마지막에는 천천히
  */

  velocity *=
    Math.pow(
      0.985,
      delta / 16
    );


  checkPegCollision();

  drawRoulette();


  /*
     완전히 멈출 때
  */

  if(
    Math.abs(velocity) < 0.002
  ) {

    velocity = 0;

    spinning = false;

    finishRoulette();

    return;
  }


  requestAnimationFrame(animate);
}


/* =========================
   결과 계산
========================= */

function finishRoulette() {

  const slice =
    Math.PI * 2 / SLOT_COUNT;


  /*
     현재 룰렛의 위쪽에
     어떤 칸이 있는지 계산
  */

  const pointerAngle =
    Math.PI * 1.5;


  let angle =
    normalizeAngle(
      pointerAngle -
      rotation +
      Math.PI / 2
    );


  let selected =
    Math.floor(
      angle / slice
    );


  selected =
    selected % SLOT_COUNT;


  /*
     결과
  */

  result.textContent =
    `🎉 결과: ${selected + 1}번 칸!`;


  result.animate(
    [
      {
        transform: "scale(.8)",
        opacity: .3
      },
      {
        transform: "scale(1.15)",
        opacity: 1
      },
      {
        transform: "scale(1)",
        opacity: 1
      }
    ],
    {
      duration: 600,
      easing: "ease-out"
    }
  );


  spinButton.disabled = false;

  spinButton.textContent =
    "🎯 다시 돌리기";
}


/* =========================
   룰렛 시작
========================= */

function spinRoulette() {

  if(spinning) return;


  spinning = true;

  spinButton.disabled = true;

  spinButton.textContent =
    "🎰 돌아가는 중...";


  result.textContent =
    "운명이 결정되고 있다...";


  /*
     랜덤 회전속도

     25~34 정도로 시작해서
     시간이 지나며 감속
  */

  velocity =
    0.025 +
    Math.random() * 0.012;


  /*
     이전 충돌 기록 초기화
  */

  lastHitAngle = rotation;


  lastTime = 0;


  requestAnimationFrame(
    animate
  );
}


/* =========================
   버튼
========================= */

spinButton.addEventListener(
  "click",
  spinRoulette
);


/* =========================
   시작
========================= */

resizeCanvas();

</script>

</body>
</html>
