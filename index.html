<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Game Center</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, "Noto Sans KR", sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #263b70 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #401d5d 0%, transparent 35%),
        linear-gradient(135deg, #080b16, #11182b 50%, #090b15);
    overflow-x: hidden;
}

/* 배경 움직임 */
body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
        radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size: 35px 35px;
    animation: backgroundMove 20s linear infinite;
    pointer-events: none;
}

@keyframes backgroundMove {
    from {
        transform: translate(0, 0);
    }
    to {
        transform: translate(35px, 35px);
    }
}

/* 공통 */
button {
    font-family: inherit;
}

.hidden {
    display: none !important;
}

/* =========================
   HOME
========================= */

#home {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 55px 25px;
}

.header {
    text-align: center;
    margin-bottom: 45px;
}

.header h1 {
    font-size: clamp(36px, 6vw, 70px);
    font-weight: 900;
    letter-spacing: -3px;
    text-shadow:
        0 0 15px rgba(100,160,255,.6),
        0 0 35px rgba(100,100,255,.3);
}

.header p {
    margin-top: 12px;
    color: #aeb9d6;
    font-size: 17px;
}

.games {
    width: min(1100px, 100%);
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 22px;
}

.game-card {
    position: relative;
    min-height: 220px;
    padding: 30px;
    border-radius: 25px;
    background: rgba(20,27,48,.72);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    overflow: hidden;
    transition: .35s;
}

.game-card::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    right: -70px;
    top: -70px;
    background: rgba(90,130,255,.16);
    filter: blur(5px);
}

.game-card:hover {
    transform: translateY(-10px);
    border-color: rgba(130,170,255,.5);
    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        0 0 30px rgba(80,130,255,.12);
}

.game-icon {
    font-size: 55px;
    margin-bottom: 18px;
}

.game-card h2 {
    font-size: 25px;
    margin-bottom: 8px;
}

.game-card p {
    color: #9faac4;
    margin-bottom: 25px;
}

.play-btn {
    border: none;
    border-radius: 13px;
    padding: 12px 22px;
    color: white;
    background: linear-gradient(135deg, #527dff, #7657ff);
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
    box-shadow: 0 8px 25px rgba(70,100,255,.25);
}

.play-btn:hover {
    transform: scale(1.05);
}

.coming {
    opacity: .45;
    cursor: default;
}

/* =========================
   ROULETTE PAGE
========================= */

#roulettePage {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    padding: 25px;
}

.topbar {
    width: min(1200px, 100%);
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.back-btn {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.07);
    color: white;
    padding: 11px 17px;
    border-radius: 12px;
    cursor: pointer;
}

.back-btn:hover {
    background: rgba(255,255,255,.14);
}

.topbar-title {
    font-size: 23px;
    font-weight: 800;
}

.roulette-layout {
    width: min(1200px, 100%);
    margin: 35px auto 0;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 30px;
}

.roulette-box {
    min-height: 700px;
    border-radius: 30px;
    background: rgba(13,18,34,.72);
    border: 1px solid rgba(255,255,255,.1);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,.35);
}

/* 룰렛 영역 */
.wheel-wrapper {
    position: relative;
    width: min(620px, 90vw);
    aspect-ratio: 1;
}

/* 캔버스 */
#wheelCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* 실제 핀/포인터 */
.pointer {
    position: absolute;
    left: 50%;
    top: -13px;
    width: 0;
    height: 0;
    border-left: 19px solid transparent;
    border-right: 19px solid transparent;
    border-top: 44px solid #ffcc4d;
    transform: translateX(-50%);
    z-index: 10;
    filter:
        drop-shadow(0 5px 5px rgba(0,0,0,.55))
        drop-shadow(0 0 8px rgba(255,190,40,.35));
    transform-origin: 50% 0%;
}

/* 핀 흔들림 */
.pointer.hit {
    animation: pointerHit .13s ease-out;
}

@keyframes pointerHit {
    0% {
        transform: translateX(-50%) rotate(0deg);
    }

    35% {
        transform: translateX(-50%) rotate(22deg);
    }

    70% {
        transform: translateX(-50%) rotate(-14deg);
    }

    100% {
        transform: translateX(-50%) rotate(0deg);
    }
}

/* 가운데 원 */
.center-glow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 75px;
    height: 75px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(circle, #303d63 0%, #171d34 55%, #090d19 100%);
    border: 5px solid #59688f;
    box-shadow:
        0 0 25px rgba(100,130,255,.35),
        inset 0 0 20px rgba(0,0,0,.8);
    z-index: 5;
}

/* 오른쪽 설정 */
.control-panel {
    border-radius: 25px;
    background: rgba(18,24,43,.82);
    border: 1px solid rgba(255,255,255,.1);
    padding: 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,.3);
}

.control-panel h2 {
    margin-bottom: 22px;
}

.control-group {
    margin-bottom: 22px;
}

.control-group label {
    display: block;
    color: #9da9c5;
    font-size: 14px;
    margin-bottom: 9px;
}

.number-control {
    display: flex;
    align-items: center;
    gap: 8px;
}

.number-control button {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 10px;
    color: white;
    background: #293453;
    cursor: pointer;
    font-size: 20px;
}

.number-control button:hover {
    background: #3a496f;
}

#slotCount {
    width: 75px;
    height: 40px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    background: #11172a;
    color: white;
    font-size: 17px;
}

#labels {
    max-height: 300px;
    overflow-y: auto;
    padding-right: 5px;
}

.label-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.label-number {
    width: 28px;
    color: #7784a4;
    font-size: 13px;
}

.label-row input {
    min-width: 0;
    flex: 1;
    height: 37px;
    padding: 0 10px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 9px;
    background: #10162a;
    color: white;
    outline: none;
}

.label-row input:focus {
    border-color: #617cff;
}

.spin-btn {
    width: 100%;
    height: 58px;
    margin-top: 8px;
    border: none;
    border-radius: 16px;
    color: white;
    background: linear-gradient(135deg, #5d7dff, #7c50ff);
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(90,90,255,.25);
    transition: .2s;
}

.spin-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 35px rgba(90,90,255,.4);
}

.spin-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
}

.result {
    margin-top: 18px;
    padding: 18px;
    border-radius: 15px;
    background: rgba(255,255,255,.05);
    text-align: center;
    min-height: 72px;
}

.result small {
    display: block;
    color: #8490ae;
    margin-bottom: 5px;
}

#resultText {
    font-size: 24px;
    font-weight: 900;
    color: #ffdb68;
}

.status {
    text-align: center;
    color: #7e8ba8;
    font-size: 13px;
    margin-top: 15px;
}

/* 모바일 */
@media (max-width: 900px) {
    .roulette-layout {
        grid-template-columns: 1fr;
    }

    .roulette-box {
        min-height: auto;
        padding: 25px 10px;
    }

    .control-panel {
        max-width: 620px;
        width: 100%;
        margin: auto;
    }
}

@media (max-width: 500px) {
    #roulettePage {
        padding: 15px;
    }

    .topbar-title {
        font-size: 18px;
    }

    .roulette-box {
        border-radius: 20px;
    }

    .control-panel {
        padding: 18px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HOME
========================= -->

<section id="home">

    <div class="header">
        <h1>MINI GAME CENTER</h1>
        <p>원하는 게임을 선택해봐</p>
    </div>

    <div class="games">

        <div class="game-card">
            <div class="game-icon">🎯</div>
            <h2>긴장감 룰렛</h2>
            <p>마지막 순간까지 결과를 알 수 없는 룰렛</p>
            <button class="play-btn" onclick="openRoulette()">
                PLAY
            </button>
        </div>

        <div class="game-card">
            <div class="game-icon">🎲</div>
            <h2>주사위</h2>
            <p>주사위를 굴려 랜덤 숫자를 확인해봐</p>
            <button class="play-btn coming">
                COMING
            </button>
        </div>

        <div class="game-card">
            <div class="game-icon">🃏</div>
            <h2>카드 뽑기</h2>
            <p>랜덤으로 카드를 한 장 뽑아봐</p>
            <button class="play-btn coming">
                COMING
            </button>
        </div>

        <div class="game-card">
            <div class="game-icon">⚡</div>
            <h2>타깃 맞히기</h2>
            <p>빠른 반응속도로 목표를 맞혀봐</p>
            <button class="play-btn coming">
                COMING
            </button>
        </div>

    </div>

</section>


<!-- =========================
     ROULETTE
========================= -->

<section id="roulettePage" class="hidden">

    <div class="topbar">

        <button class="back-btn" onclick="goHome()">
            ← 게임 선택
        </button>

        <div class="topbar-title">
            🎯 긴장감 룰렛
        </div>

        <div style="width:80px;"></div>

    </div>


    <div class="roulette-layout">

        <!-- 룰렛 -->
        <div class="roulette-box">

            <div class="wheel-wrapper">

                <canvas id="wheelCanvas"></canvas>

                <div id="pointer" class="pointer"></div>

                <div class="center-glow"></div>

            </div>

        </div>


        <!-- 설정 -->
        <div class="control-panel">

            <h2>룰렛 설정</h2>

            <div class="control-group">

                <label>칸 수</label>

                <div class="number-control">

                    <button onclick="changeSlotCount(-1)">
                        −
                    </button>

                    <input
                        id="slotCount"
                        type="number"
                        min="2"
                        max="30"
                        value="8"
                        onchange="setSlotCount()"
                    >

                    <button onclick="changeSlotCount(1)">
                        ＋
                    </button>

                </div>

            </div>


            <div class="control-group">

                <label>칸 이름</label>

                <div id="labels"></div>

            </div>


            <button
                id="spinBtn"
                class="spin-btn"
                onclick="spinRoulette()"
            >
                🎯 돌리기
            </button>


            <div class="result">

                <small>RESULT</small>

                <div id="resultText">
                    -
                </div>

            </div>

            <div id="status" class="status">
                준비 완료
            </div>

        </div>

    </div>

</section>


<script>

/* =========================
   기본 설정
========================= */

const home = document.getElementById("home");
const roulettePage = document.getElementById("roulettePage");

const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");

const pointer = document.getElementById("pointer");

const slotCountInput = document.getElementById("slotCount");
const labelsContainer = document.getElementById("labels");

const spinButton = document.getElementById("spinBtn");
const resultText = document.getElementById("resultText");
const statusText = document.getElementById("status");

let slotCount = 8;

let labels = [];

let currentRotation = 0;

let spinning = false;

let animationFrame = null;

let lastBoundary = null;


/* =========================
   페이지 이동
========================= */

function openRoulette() {

    home.classList.add("hidden");
    roulettePage.classList.remove("hidden");

    resizeCanvas();

    createLabels();

    drawWheel();

}


function goHome() {

    roulettePage.classList.add("hidden");
    home.classList.remove("hidden");

}


/* =========================
   캔버스 크기
========================= */

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    const size = Math.min(
        rect.width || 600,
        rect.height || 600
    );

    const dpr = window.devicePixelRatio || 1;

    canvas.width = size * dpr;
    canvas.height = size * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    drawWheel();

}


/* =========================
   슬롯 생성
========================= */

function createLabels() {

    labelsContainer.innerHTML = "";

    labels = [];

    for (let i = 0; i < slotCount; i++) {

        labels.push(
            "선택 " + (i + 1)
        );

        const row = document.createElement("div");

        row.className = "label-row";

        row.innerHTML = `
            <span class="label-number">
                ${i + 1}
            </span>

            <input
                type="text"
                value="선택 ${i + 1}"
                data-index="${i}"
                maxlength="20"
            >
        `;

        labelsContainer.appendChild(row);

    }

    labelsContainer
        .querySelectorAll("input")
        .forEach(input => {

            input.addEventListener(
                "input",
                function() {

                    labels[
                        Number(this.dataset.index)
                    ] = this.value || "선택";

                    drawWheel();

                }
            );

        });

}


/* =========================
   칸 수 변경
========================= */

function changeSlotCount(amount) {

    if (spinning) return;

    let value =
        Number(slotCountInput.value) + amount;

    value = Math.max(
        2,
        Math.min(30, value)
    );

    slotCountInput.value = value;

    setSlotCount();

}


function setSlotCount() {

    if (spinning) return;

    let value =
        Number(slotCountInput.value);

    if (!Number.isFinite(value)) {
        value = 8;
    }

    value = Math.round(value);

    value = Math.max(
        2,
        Math.min(30, value)
    );

    slotCount = value;

    slotCountInput.value = slotCount;

    createLabels();

    drawWheel();

}


/* =========================
   룰렛 그리기
========================= */

function drawWheel() {

    if (!canvas.width) return;

    const rect = canvas.getBoundingClientRect();

    const size = Math.min(
        rect.width,
        rect.height
    );

    if (!size) return;

    const cx = size / 2;
    const cy = size / 2;

    const radius = size * 0.40;

    ctx.clearRect(
        0,
        0,
        size,
        size
    );

    ctx.save();

    ctx.translate(cx, cy);

    ctx.rotate(currentRotation);

    /* 바깥 그림자 */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius + 15,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "rgba(0,0,0,.45)";

    ctx.fill();


    /* 룰렛 색상 */

    const colors = [
        "#d84d5a",
        "#496ee8",
        "#e49a38",
        "#46a66d",
        "#8b5bd6",
        "#d05b9b",
        "#4c9fc8",
        "#c96d3f"
    ];


    const slice =
        Math.PI * 2 / slotCount;


    /* 칸 */

    for (let i = 0; i < slotCount; i++) {

        const start =
            -Math.PI / 2 +
            i * slice;

        const end =
            start + slice;

        ctx.beginPath();

        ctx.moveTo(0, 0);

        ctx.arc(
            0,
            0,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            colors[i % colors.length];

        ctx.fill();

        ctx.lineWidth = 3;

        ctx.strokeStyle =
            "rgba(255,255,255,.22)";

        ctx.stroke();


        /* 텍스트 */

        ctx.save();

        const middle =
            start + slice / 2;

        ctx.rotate(middle);

        ctx.textAlign = "center";

        ctx.textBaseline = "middle";

        let fontSize =
            Math.max(
                11,
                Math.min(
                    20,
                    250 / slotCount
                )
            );

        ctx.font =
            `900 ${fontSize}px Arial`;

        ctx.fillStyle = "white";

        ctx.shadowColor =
            "rgba(0,0,0,.55)";

        ctx.shadowBlur = 5;

        let text =
            labels[i] || `선택 ${i + 1}`;

        const maxChars =
            slotCount >= 20 ? 5 : 8;

        if (text.length > maxChars) {
            text =
                text.substring(0, maxChars) + "…";
        }

        ctx.fillText(
            text,
            radius * 0.67,
            0
        );

        ctx.restore();

    }


    /* 내부 링 */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.lineWidth = 9;

    ctx.strokeStyle = "#d8b85b";

    ctx.stroke();


    /* 중심 장식 */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius * .16,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#1a2139";

    ctx.fill();

    ctx.lineWidth = 5;

    ctx.strokeStyle = "#c9a94f";

    ctx.stroke();


    ctx.restore();


    /* 바깥쪽 돌출 핀 */

    drawPegs(
        cx,
        cy,
        radius
    );

}


/* =========================
   바깥 돌출 핀
========================= */

function drawPegs(cx, cy, radius) {

    const rect =
        canvas.getBoundingClientRect();

    const size =
        Math.min(rect.width, rect.height);

    const pegRadius =
        Math.max(5, size * .011);

    const pegDistance =
        radius + 17;

    ctx.save();

    ctx.translate(cx, cy);

    ctx.rotate(currentRotation);

    for (let i = 0; i < slotCount; i++) {

        const angle =
            -Math.PI / 2 +
            i *
            Math.PI * 2 /
            slotCount;

        const x =
            Math.cos(angle) *
            pegDistance;

        const y =
            Math.sin(angle) *
            pegDistance;


        /* 그림자 */

        ctx.beginPath();

        ctx.arc(
            x + 2,
            y + 3,
            pegRadius + 2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(0,0,0,.5)";

        ctx.fill();


        /* 핀 */

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            pegRadius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#d6b75c";

        ctx.fill();

        ctx.lineWidth = 2;

        ctx.strokeStyle =
            "rgba(255,255,255,.55)";

        ctx.stroke();

    }

    ctx.restore();

}


/* =========================
   회전
========================= */

function normalizeAngle(angle) {

    const full =
        Math.PI * 2;

    angle %= full;

    if (angle < 0) {
        angle += full;
    }

    return angle;

}


/* easing
   처음에는 빠르고
   마지막에 아주 부드럽게 감속
*/

function easeOutQuint(t) {

    return 1 -
        Math.pow(
            1 - t,
            5
        );

}


/* =========================
   포인터 충돌 효과
========================= */

function checkPointerHits(rotation) {

    const slice =
        Math.PI * 2 / slotCount;

    /*
      포인터는 위쪽.
      룰렛의 경계가 포인터를 지날 때
      핀이 걸리는 듯한 효과.
    */

    const pointerAngle =
        normalizeAngle(
            -rotation
        );

    const boundary =
        Math.round(
            pointerAngle / slice
        );

    if (
        lastBoundary !== null &&
        boundary !== lastBoundary
    ) {

        pointer.classList.remove("hit");

        void pointer.offsetWidth;

        pointer.classList.add("hit");

        setTimeout(() => {
            pointer.classList.remove("hit");
        }, 140);

    }

    lastBoundary = boundary;

}


/* =========================
   룰렛 돌리기
========================= */

function spinRoulette() {

    if (spinning) return;

    spinning = true;

    spinButton.disabled = true;

    resultText.textContent = "...";

    statusText.textContent =
        "룰렛이 돌아가는 중...";

    pointer.classList.remove("hit");

    lastBoundary = null;


    /* 결과 랜덤 선택 */

    const targetIndex =
        Math.floor(
            Math.random() * slotCount
        );


    /*
      선택된 칸의 중심을
      위쪽 포인터에 맞춘다.
    */

    const slice =
        Math.PI * 2 / slotCount;

    const targetCenter =
        targetIndex * slice +
        slice / 2;


    /*
      룰렛을 많이 돌린 뒤
      목표 위치에서 멈추도록 계산.
    */

    const extraTurns =
        6 +
        Math.random() * 3.5;

    const targetRotation =
        extraTurns * Math.PI * 2 -
        targetCenter;


    const startRotation =
        currentRotation;

    const finalRotation =
        currentRotation +
        targetRotation;


    /*
      6.5~8.5초 정도의 긴 회전
    */

    const duration =
        6500 +
        Math.random() * 2000;

    const startTime =
        performance.now();


    function animate(now) {

        const elapsed =
            now - startTime;

        let progress =
            Math.min(
                elapsed / duration,
                1
            );


        /*
          초반 빠르게,
          중반부터 감속,
          마지막에는 천천히.
        */

        const eased =
            easeOutQuint(progress);


        currentRotation =
            startRotation +
            targetRotation *
            eased;


        drawWheel();

        checkPointerHits(
            currentRotation
        );


        if (progress < 1) {

            animationFrame =
                requestAnimationFrame(
                    animate
                );

        } else {

            currentRotation =
                finalRotation;

            drawWheel();

            finishSpin(
                targetIndex
            );

        }

    }


    animationFrame =
        requestAnimationFrame(
            animate
        );

}


/* =========================
   결과
========================= */

function finishSpin(index) {

    spinning = false;

    spinButton.disabled = false;

    const result =
        labels[index] ||
        `선택 ${index + 1}`;


    /*
      마지막에 살짝 한 번 튕김
    */

    pointer.classList.remove("hit");

    void pointer.offsetWidth;

    pointer.classList.add("hit");

    resultText.textContent =
        result;

    statusText.textContent =
        "결과가 결정됐어!";

}


/* =========================
   창 크기 변경
========================= */

window.addEventListener(
    "resize",
    () => {

        if (
            !roulettePage.classList.contains(
                "hidden"
            )
        ) {

            resizeCanvas();

        }

    }
);


/* =========================
   시작
========================= */

createLabels();

</script>
