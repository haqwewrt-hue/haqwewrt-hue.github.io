<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>Mini Game Center</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, "Noto Sans KR", sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #263b70 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #401d5d 0%, transparent 35%),
        linear-gradient(135deg, #080b16, #11182b 50%, #090b15);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
        radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size: 35px 35px;
    animation: backgroundMove 20s linear infinite;
    pointer-events: none;
}

@keyframes backgroundMove {
    from { transform: translate(0,0); }
    to { transform: translate(35px,35px); }
}

button {
    font-family: inherit;
}

.hidden {
    display: none !important;
}


/* =========================
   HOME
========================= */

#home {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 55px 25px;
}

.header {
    text-align: center;
    margin-bottom: 45px;
}

.header h1 {
    font-size: clamp(36px, 6vw, 70px);
    font-weight: 900;
    letter-spacing: -3px;
    text-shadow:
        0 0 15px rgba(100,160,255,.6),
        0 0 35px rgba(100,100,255,.3);
}

.header p {
    margin-top: 12px;
    color: #aeb9d6;
    font-size: 17px;
}

.games {
    width: min(1100px, 100%);
    margin: auto;

   ROULETTE
========================= */

#roulettePage {
    position: relative;

}

    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,.35);
}


/*
    ==================================================
    중요:
    wheel-wrapper 자체가 룰렛 전체의 기준점이다.

    포인터는 이 기준점의 정확한 X 중앙에 고정된다.
    룰렛(canvas)은 그 안에서 회전한다.
    ==================================================
*/

.wheel-wrapper {
    position: relative;
    width: min(620px, 90vw);
    aspect-ratio: 1;
}


/* 룰렛 캔버스 */

#wheelCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}


/*
    포인터
    - 정확히 룰렛 정중앙 위
    - X = 50%
    - 회전 기준점도 위쪽
*/

.pointer {
    position: absolute;

    left: 50%;
    top: -5px;

    width: 0;
    height: 0;

    border-left: 19px solid transparent;
    border-right: 19px solid transparent;
    border-top: 48px solid #ffcc4d;

    transform:
        translateX(-50%)
        rotate(0deg);

    transform-origin: 50% 0%;

    z-index: 20;

    filter:
        drop-shadow(0 5px 5px rgba(0,0,0,.55))
        drop-shadow(0 0 8px rgba(255,190,40,.35));
}


/*
    핀이 걸릴 때 살짝 휘는 효과
*/

.pointer.hit {
    animation: pointerHit .16s ease-out;
}

@keyframes pointerHit {

    0% {
        transform:
            translateX(-50%)
            rotate(0deg);
    }

    25% {
        transform:
            translateX(-50%)
            rotate(18deg);
    }

    50% {
        transform:
            translateX(-50%)
            rotate(-11deg);
    }

    75% {
        transform:
            translateX(-50%)
            rotate(7deg);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(0deg);
    }
}


/* 가운데 장식 */

    position: absolute;

    left: 50%;

</style>

<body>


<!-- ==========================================
     게임 선택 화면
========================================== -->

<section id="home">

    <div class="header">

        <h1>MINI GAME CENTER</h1>

            </h2>

            </p>

            </button>

<!-- ==========================================
     룰렛 화면
========================================== -->

<section
    id="roulettePage"
    class="hidden"
>

    <div class="topbar">

        <button
            class="back-btn"
            onclick="goHome()"
        >
            ← 게임 선택
        </button>

        <div class="topbar-title">
            🎯 긴장감 룰렛
        </div>

        <div style="width:80px;"></div>

    </div>


    <div class="roulette-layout">


        <!-- 룰렛 -->

        <div class="roulette-box">

            <div class="wheel-wrapper">

                <!-- 실제 회전판 -->

                <canvas
                    id="wheelCanvas"
                ></canvas>


                <!-- 고정 포인터 -->

                <div
                    id="pointer"
                    class="pointer"
                ></div>


                <!-- 중앙 -->

                <div
                    class="center-glow"
                ></div>

            </div>

        </div>



        <!-- 설정 -->

        <div class="control-panel">

            <h2>
                룰렛 설정
            </h2>


            <div class="control-group">

                <label>
                    칸 수
                </label>

                <div class="number-control">

                    <button
                        onclick="changeSlotCount(-1)"
                    >
                        −
                    </button>

                    <input
                        id="slotCount"
                        type="number"
                        min="2"
                        max="30"
                        value="8"
                        onchange="setSlotCount()"
                    >

                    <button
                        onclick="changeSlotCount(1)"
                    >
                        ＋
                    </button>

                </div>

            </div>


            <div class="control-group">

                <label>
                    칸 이름
                </label>

                <div id="labels"></div>

            </div>


            <button
                id="spinBtn"
                class="spin-btn"
                onclick="spinRoulette()"
            >
                🎯 돌리기
            </button>


            <div class="result">

                <small>
                    RESULT
                </small>

                <div id="resultText">
                    -
                </div>

            </div>


            <div
                id="status"
                class="status"
            >
                준비 완료
            </div>

        </div>

<script>

/* ==========================================
   기본 변수
========================================== */

const home =
    document.getElementById("home");

const roulettePage =
    document.getElementById("roulettePage");

const canvas =
    document.getElementById("wheelCanvas");

const ctx =
    canvas.getContext("2d");

const pointer =
    document.getElementById("pointer");

const slotCountInput =
    document.getElementById("slotCount");

const labelsContainer =
    document.getElementById("labels");

const spinButton =
    document.getElementById("spinBtn");

const resultText =
    document.getElementById("resultText");

const statusText =
    document.getElementById("status");


let slotCount = 8;

let labels = [];

let currentRotation = 0;

let spinning = false;

let animationFrame = null;

let lastBoundary = null;


/* ==========================================
   화면 이동
========================================== */

function openRoulette() {

    home.classList.add("hidden");

    roulettePage.classList.remove("hidden");

    resizeCanvas();

    createLabels();

    drawWheel();

}


function goHome() {

    if (spinning) return;

    roulettePage.classList.add("hidden");

    home.classList.remove("hidden");

}


/* ==========================================
   Canvas 크기
========================================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const size =
        Math.min(
            rect.width || 600,
            rect.height || 600
        );

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        size * dpr;

    canvas.height =
        size * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    drawWheel();

}


/* ==========================================
   이름 생성
========================================== */

function createLabels() {

    labelsContainer.innerHTML = "";

    labels = [];

    for (
        let i = 0;
        i < slotCount;
        i++
    ) {

        labels.push(
            "선택 " + (i + 1)
        );

        const row =
            document.createElement("div");

        row.className =
            "label-row";

        row.innerHTML = `
            <span class="label-number">
                ${i + 1}
            </span>

            <input
                type="text"
                value="선택 ${i + 1}"
                data-index="${i}"
                maxlength="20"
            >
        `;

        labelsContainer.appendChild(row);

    }


    labelsContainer
        .querySelectorAll("input")
        .forEach(input => {

            input.addEventListener(
                "input",
                function() {

                    labels[
                        Number(
                            this.dataset.index
                        )
                    ] =
                        this.value ||
                        "선택";

                    drawWheel();

                }
            );

        });

}


/* ==========================================
   칸 수
========================================== */

function changeSlotCount(amount) {

    if (spinning) return;

    let value =
        Number(slotCountInput.value) +
        amount;

    value =
        Math.max(
            2,
            Math.min(30, value)
        );

    slotCountInput.value =
        value;

    setSlotCount();

}


function setSlotCount() {

    if (spinning) return;

    let value =
        Number(slotCountInput.value);

    if (!Number.isFinite(value)) {
        value = 8;
    }

    value =
        Math.round(value);

    value =
        Math.max(
            2,
            Math.min(30, value)
        );

    slotCount = value;

    slotCountInput.value =
        value;

    createLabels();

    drawWheel();

}


/* ==========================================
   룰렛 그리기
========================================== */

function drawWheel() {

    if (!canvas.width) return;

    const rect =
        canvas.getBoundingClientRect();

    const size =
        Math.min(
            rect.width,
            rect.height
        );

    if (!size) return;


    const cx =
        size / 2;

    const cy =
        size / 2;


    /*
        실제 룰렛 반지름

        포인터는 룰렛 위쪽 중앙에 있으므로
        룰렛의 최상단과 돌출 핀이
        정확히 같은 기준선에 오도록 계산한다.
    */

    const radius =
        size * 0.39;


    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    /*
        룰렛 전체를 회전시키는 부분
    */

    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.rotate(
        currentRotation
    );


    /* =========================
       바깥 그림자
    ========================= */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius + 18,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.48)";

    ctx.fill();


    /* =========================
       룰렛 칸
    ========================= */

    const colors = [
        "#d84d5a",
        "#496ee8",
        "#e49a38",
        "#46a66d",
        "#8b5bd6",
        "#d05b9b",
        "#4c9fc8",
        "#c96d3f"
    ];


    const slice =
        Math.PI * 2 /
        slotCount;


    for (
        let i = 0;
        i < slotCount;
        i++
    ) {

        /*
            첫 번째 칸의 중앙이
            기본적으로 위쪽을 바라보도록 구성
        */

        const start =
            -Math.PI / 2 +
            i * slice;

        const end =
            start + slice;


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.arc(
            0,
            0,
            radius,
            start,
            end
        );

        ctx.closePath();


        ctx.fillStyle =
            colors[
                i % colors.length
            ];

        ctx.fill();


        ctx.lineWidth = 3;

        ctx.strokeStyle =
            "rgba(255,255,255,.22)";

        ctx.stroke();


        /* =========================
           텍스트
        ========================= */

        ctx.save();

        const middle =
            start +
            slice / 2;

        ctx.rotate(
            middle
        );

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        const fontSize =
            Math.max(
                11,
                Math.min(
                    20,
                    250 / slotCount
                )
            );


        ctx.font =
            `900 ${fontSize}px Arial`;

        ctx.fillStyle =
            "white";

        ctx.shadowColor =
            "rgba(0,0,0,.55)";

        ctx.shadowBlur = 5;


        let text =
            labels[i] ||
            `선택 ${i + 1}`;


        const maxChars =
            slotCount >= 20
                ? 5
                : 8;


        if (
            text.length >
            maxChars
        ) {

            text =
                text.substring(
                    0,
                    maxChars
                ) + "…";

        }


        ctx.fillText(
            text,
            radius * .67,
            0
        );


        ctx.restore();

    }


    /* =========================
       룰렛 테두리
    ========================= */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.lineWidth = 9;

    ctx.strokeStyle =
        "#d8b75b";

    ctx.stroke();


    /*
        안쪽 테두리
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius - 12,
        0,
        Math.PI * 2
    );

    ctx.lineWidth = 2;

    ctx.strokeStyle =
        "rgba(255,255,255,.18)";

    ctx.stroke();


    ctx.restore();


    /*
        중요:
        돌출 핀은 룰렛과 동일한
        중심 좌표를 사용한다.
    */

    drawPegs(
        cx,
        cy,
        radius
    );

}


/* ==========================================
   돌출 핀
========================================== */

function drawPegs(
    cx,
    cy,
    radius
) {

    const rect =
        canvas.getBoundingClientRect();

    const size =
        Math.min(
            rect.width,
            rect.height
        );


    /*
        룰렛 테두리 바로 바깥에 핀을 둔다.
        따라서 포인터가 위쪽에 있을 때
        위쪽 핀이 포인터 끝에 정확히 위치한다.
    */

    const pegRadius =
        Math.max(
            5,
            size * 0.012
        );


    const pegDistance =
        radius + 16;


    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.rotate(
        currentRotation
    );


    /*
        핀은 '칸의 경계'에 위치한다.

        룰렛의 시작각과 동일한 기준을 사용하므로
        실제 칸과 핀이 어긋나지 않는다.
    */

    const slice =
        Math.PI * 2 /
        slotCount;


    for (
        let i = 0;
        i < slotCount;
        i++
    ) {

        const angle =
            -Math.PI / 2 +
            i * slice;


        const x =
            Math.cos(angle) *
            pegDistance;

        const y =
            Math.sin(angle) *
            pegDistance;


        /* 그림자 */

        ctx.beginPath();

        ctx.arc(
            x + 2,
            y + 3,
            pegRadius + 2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(0,0,0,.55)";

        ctx.fill();


        /* 실제 돌출 핀 */

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            pegRadius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#d7b85c";

        ctx.fill();


        ctx.lineWidth = 2;

        ctx.strokeStyle =
            "rgba(255,255,255,.6)";

        ctx.stroke();

    }


    ctx.restore();

}


/* ==========================================
   각도 정리
========================================== */

function normalizeAngle(angle) {

    const full =
        Math.PI * 2;

    angle %= full;

    if (angle < 0) {
        angle += full;
    }

    return angle;

}


/* ==========================================
   감속 함수
========================================== */

function easeOutQuint(t) {

    return 1 -
        Math.pow(
            1 - t,
            5
        );

}


/* ==========================================
   핀 충돌 감지
========================================== */

function checkPointerHits(
    rotation
) {

    /*
        룰렛의 경계가
        고정된 포인터의 위쪽을
        지나갈 때 충돌 처리
    */

    const slice =
        Math.PI * 2 /
        slotCount;


    const pointerAngle =
        normalizeAngle(
            -rotation
        );


    const boundary =
        Math.round(
            pointerAngle /
            slice
        );


    if (
        lastBoundary !== null &&
        boundary !== lastBoundary
    ) {

        pointer.classList.remove(
            "hit"
        );

        /*
            animation 재시작
        */

        void pointer.offsetWidth;

        pointer.classList.add(
            "hit"
        );


        setTimeout(() => {

            pointer.classList.remove(
                "hit"
            );

        }, 160);

    }


    lastBoundary =
        boundary;

}


/* ==========================================
   룰렛 돌리기
========================================== */

function spinRoulette() {

    if (spinning) return;

    spinning = true;

    spinButton.disabled =
        true;

    resultText.textContent =
        "...";

    statusText.textContent =
        "룰렛이 돌아가는 중...";

    pointer.classList.remove(
        "hit"
    );

    lastBoundary = null;


    /*
        랜덤 결과
    */

    const targetIndex =
        Math.floor(
            Math.random() *
            slotCount
        );


    const slice =
        Math.PI * 2 /
        slotCount;


    /*
        이번에는 결과 칸의
        '경계선/돌출 핀'이
        포인터에 걸리도록 한다.

        즉 칸의 중앙이 아니라
        칸과 칸 사이의 핀 위치를
        포인터 끝에 맞춘다.
    */

    const targetBoundary =
        targetIndex *
        slice;


    /*
        많이 회전시킨다.
    */

    const extraTurns =
        7 +
        Math.random() * 3;


    /*
        룰렛의 위쪽 기준각은
        -PI/2 이므로
        최종적으로 해당 경계가
        정확히 위쪽에 오게 한다.
    */

    const desiredRotation =
        extraTurns *
        Math.PI * 2 -
        targetBoundary;


    const startRotation =
        currentRotation;


    const finalRotation =
        currentRotation +
        desiredRotation;


    /*
        7~9초
    */

    const duration =
        7000 +
        Math.random() * 1800;


    const startTime =
        performance.now();


    function animate(now) {

        const elapsed =
            now - startTime;


        const progress =
            Math.min(
                elapsed /
                duration,
                1
            );


        /*
            부드러운 감속
        */

        const eased =
            easeOutQuint(
                progress
            );


        currentRotation =
            startRotation +
            (
                finalRotation -
                startRotation
            ) *
            eased;


        drawWheel();

        checkPointerHits(
            currentRotation
        );


        if (
            progress < 1
        ) {

            animationFrame =
                requestAnimationFrame(
                    animate
                );

        } else {

            currentRotation =
                finalRotation;

            drawWheel();

            finishSpin(
                targetIndex
            );

        }

    }


    animationFrame =
        requestAnimationFrame(
            animate
        );

}


/* ==========================================
   결과 처리
========================================== */

function finishSpin(
    index
) {

    spinning = false;

    spinButton.disabled =
        false;


    /*
        마지막 핀 충돌
    */

    pointer.classList.remove(
        "hit"
    );

    void pointer.offsetWidth;

    pointer.classList.add(
        "hit"
    );


    const result =
        labels[index] ||
        `선택 ${index + 1}`;


    resultText.textContent =
        result;


    statusText.textContent =
        "결과가 결정됐어!";

}


/* ==========================================
   창 크기 변경
========================================== */

window.addEventListener(
    "resize",
    () => {

        if (
            !roulettePage.classList.contains(
                "hidden"
            )
        ) {

            resizeCanvas();

        }

    }
);


/* ==========================================
   시작
========================================== */

createLabels();

</script>
