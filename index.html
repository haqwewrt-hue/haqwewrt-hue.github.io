<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>시간의 기록소</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;

  background:
    radial-gradient(circle at 50% 20%, #27276e, #09091d 65%);

  overflow-x: hidden;
}

/* =========================
   공통
========================= */

.screen {
  width: 100%;
  min-height: 100vh;

  display: none;

  justify-content: center;
  align-items: center;

  padding: 30px 15px;
}

.screen.active {
  display: flex;
}

.container {
  width: 100%;
  max-width: 1100px;

  text-align: center;
}

h1 {
  margin: 0 0 10px;

  font-size: clamp(36px, 6vw, 65px);

  text-shadow:
    0 0 25px #697cff;
}

.subtitle {
  color: #c7c7e8;
  margin-bottom: 40px;
}

/* =========================
   메인 메뉴
========================= */

.games {
  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(230px, 1fr));

  gap: 22px;

  width: 100%;
}

.game-card {
  min-height: 220px;

  padding: 30px 20px;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  border-radius: 28px;

  background:
    rgba(255,255,255,.09);

  border:
    1px solid rgba(255,255,255,.16);

  backdrop-filter: blur(15px);

  cursor: pointer;

  transition:
    transform .25s,
    background .25s,
    box-shadow .25s;
}

.game-card:hover {
  transform:
    translateY(-10px)
    scale(1.02);

  background:
    rgba(255,255,255,.15);

  box-shadow:
    0 20px 50px rgba(0,0,0,.4),
    0 0 30px rgba(105,124,255,.25);
}

.game-icon {
  font-size: 70px;

  margin-bottom: 15px;
}

.game-card h2 {
  margin: 5px 0;

  font-size: 25px;
}

.game-card p {
  margin: 8px 0 0;

  color: #bdbdd8;
}


/* =========================
   게임 화면
========================= */

.game-window {
  width: 100%;
  max-width: 1000px;

  padding: 30px 20px 40px;

  border-radius: 35px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.15);

  backdrop-filter: blur(15px);

  box-shadow:
    0 30px 100px rgba(0,0,0,.6);
}

.back {
  position: absolute;

  top: 20px;
  left: 20px;

  padding: 10px 18px;

  border: 0;
  border-radius: 20px;

  color: white;

  background:
    rgba(255,255,255,.12);

  cursor: pointer;

  font-size: 15px;
}

.back:hover {
  background:
    rgba(255,255,255,.2);
}


/* =========================
   룰렛
========================= */

.roulette-area {
  position: relative;

  width: min(85vw, 760px);

  aspect-ratio: 1 / 1;

  margin: 10px auto 20px;
}

#roulette {
  width: 100%;
  height: 100%;

  display: block;
}


/* 화살표 */

.pointer {
  position: absolute;

  left: 50%;
  top: -5px;

  width: 70px;
  height: 125px;

  transform:
    translateX(-50%)
    rotate(0deg);

  transform-origin:
    50% 10px;

  z-index: 10;

  filter:
    drop-shadow(
      0 5px 8px rgba(0,0,0,.6)
    );

  transition:
    transform .08s cubic-bezier(.2,.8,.2,1);
}

.pointer::before {
  content: "";

  position: absolute;

  left: 50%;
  top: 0;

  width: 30px;
  height: 100px;

  transform:
    translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #aaa,
      white,
      #ddd
    );

  clip-path:
    polygon(
      50% 0%,
      100% 18%,
      75% 100%,
      50% 85%,
      25% 100%,
      0% 18%
    );

  border-radius: 7px;
}

.pointer::after {
  content: "";

  position: absolute;

  left: 50%;
  top: -7px;

  width: 24px;
  height: 24px;

  transform:
    translateX(-50%);

  border-radius: 50%;

  background: white;

  border:
    4px solid #ccc;

  box-shadow:
    0 3px 8px rgba(0,0,0,.6);
}


/* 룰렛 설정 */

.roulette-settings {
  margin: 10px 0 15px;
}

.roulette-settings select {
  padding: 10px 18px;

  border-radius: 15px;

  border: 1px solid #555;

  background: #17172f;

  color: white;

  font-size: 16px;
}


/* 결과 */

.result {
  min-height: 60px;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 27px;
  font-weight: bold;

  text-shadow:
    0 0 15px #8fa0ff;
}


/* 버튼 */

.main-button {
  padding: 17px 45px;

  border: 0;

  border-radius: 40px;

  color: white;

  font-size: 18px;
  font-weight: bold;

  background:
    linear-gradient(
      135deg,
      #697cff,
      #8b5cff
    );

  cursor: pointer;

  box-shadow:
    0 8px 25px rgba(80,80,255,.35);

  transition: .2s;
}

.main-button:hover {
  transform:
    scale(1.06);

  box-shadow:
    0 0 35px
    rgba(105,124,255,.8);
}

.main-button:active {
  transform:
    scale(.95);
}

.main-button:disabled {
  opacity: .5;
  cursor: not-allowed;
}


/* =========================
   순발력 게임
========================= */

.reaction-box {
  width: 100%;
  max-width: 700px;

  height: 400px;

  margin: 30px auto;

  display: flex;

  justify-content: center;
  align-items: center;

  border-radius: 30px;

  background: #29294b;

  cursor: pointer;

  font-size: 35px;
  font-weight: bold;

  user-select: none;
}

.reaction-box.ready {
  background: #8b2424;
}

.reaction-box.go {
  background: #208d5c;

  box-shadow:
    0 0 60px
    rgba(40,255,150,.4);
}


/* =========================
   주사위
========================= */

.dice {
  font-size: 180px;

  margin: 40px 0;

  filter:
    drop-shadow(
      0 15px 25px rgba(0,0,0,.5)
    );

  transition:
    transform .2s;
}

.dice.rolling {
  animation:
    diceRoll .15s
    infinite linear;
}

@keyframes diceRoll {

  0% {
    transform:
      rotate(0deg)
      scale(1);
  }

  50% {
    transform:
      rotate(180deg)
      scale(1.15);
  }

  100% {
    transform:
      rotate(360deg)
      scale(1);
  }
}


/* 모바일 */

@media(max-width:600px) {

  .game-window {
    padding:
      25px 10px 35px;
  }

  .pointer {
    transform-origin:
      50% 10px;
  }

  .reaction-box {
    height: 300px;
  }
}
</style>
</head>


<body>


<!-- =========================
     메인 화면
========================= -->

<section id="home" class="screen active">

  <div class="container">

    <h1>🌌 시간의 기록소</h1>

    <div class="subtitle">
      오늘은 어떤 게임을 해볼까?
    </div>


    <div class="games">


      <!-- 룰렛 -->

      <div
        class="game-card"
        onclick="openGame('roulette')"
      >

        <div class="game-icon">
          🎰
        </div>

        <h2>
          운명의 룰렛
        </h2>

        <p>
          마지막 순간까지 결과를 알 수 없다
        </p>

      </div>


      <!-- 순발력 -->

      <div
        class="game-card"
        onclick="openGame('reaction')"
      >

        <div class="game-icon">
          ⚡
        </div>

        <h2>
          순발력 테스트
        </h2>

        <p>
          얼마나 빨리 반응할 수 있을까?
        </p>

      </div>


      <!-- 주사위 -->

      <div
        class="game-card"
        onclick="openGame('dice')"
      >

        <div class="game-icon">
          🎲
        </div>

        <h2>
          행운의 주사위
        </h2>

        <p>
          오늘의 운을 시험해보자
        </p>

      </div>


      <!-- 준비중 -->

      <div
        class="game-card"
        onclick="comingSoon()"
      >

        <div class="game-icon">
          ❓
        </div>

        <h2>
          새로운 게임
        </h2>

        <p>
          곧 추가 예정
        </p>

      </div>

    </div>

  </div>

</section>



<!-- =========================
     룰렛 화면
========================= -->

<section id="roulette" class="screen">

  <button
    class="back"
    onclick="goHome()"
  >
    ← 게임 목록
  </button>


  <div class="game-window">

    <h1>
      🎰 운명의 룰렛
    </h1>

    <div class="subtitle">
      점점 느려진다... 마지막에 어디에 걸릴까?
    </div>


    <div class="roulette-settings">

      칸 수:

      <select
        id="slotSelect"
        onchange="changeSlots()"
      >

        <option value="2">2칸</option>
        <option value="4">4칸</option>
        <option value="6">6칸</option>
        <option value="8">8칸</option>
        <option value="10">10칸</option>
        <option value="12">12칸</option>
        <option value="15">15칸</option>
        <option value="20">20칸</option>
        <option value="25">25칸</option>
        <option value="30" selected>30칸</option>

      </select>

    </div>


    <div class="roulette-area">

      <canvas id="rouletteCanvas"></canvas>

      <div
        id="pointer"
        class="pointer"
      ></div>

    </div>


    <div
      id="rouletteResult"
      class="result"
    >
      버튼을 눌러 운명을 결정해봐...
    </div>


    <button
      id="spinButton"
      class="main-button"
      onclick="spinRoulette()"
    >
      🎯 룰렛 돌리기
    </button>

  </div>

</section>



<!-- =========================
     순발력 게임
========================= -->

<section id="reaction" class="screen">

  <button
    class="back"
    onclick="goHome()"
  >
    ← 게임 목록
  </button>


  <div class="game-window">

    <h1>
      ⚡ 순발력 테스트
    </h1>

    <div class="subtitle">
      초록색이 되는 순간 클릭!
    </div>


    <div
      id="reactionBox"
      class="reaction-box"
      onclick="reactionClick()"
    >
      시작 버튼을 눌러줘
    </div>


    <div
      id="reactionResult"
      class="result"
    >
    </div>


    <button
      class="main-button"
      onclick="startReaction()"
    >
      ⚡ 시작
    </button>

  </div>

</section>



<!-- =========================
     주사위 게임
========================= -->

<section id="dice" class="screen">

  <button
    class="back"
    onclick="goHome()"
  >
    ← 게임 목록
  </button>


  <div class="game-window">

    <h1>
      🎲 행운의 주사위
    </h1>

    <div class="subtitle">
      오늘의 숫자는?
    </div>


    <div
      id="dice"
      class="dice"
    >
      🎲
    </div>


    <div
      id="diceResult"
      class="result"
    >
      주사위를 굴려보자!
    </div>


    <button
      class="main-button"
      onclick="rollDice()"
    >
      🎲 굴리기
    </button>

  </div>

</section>



<script>

/* ==================================================
   화면 이동
================================================== */

function openGame(game) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.remove("active");
    });

  document
    .getElementById(game)
    .classList.add("active");

}


function goHome() {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.remove("active");
    });

  document
    .getElementById("home")
    .classList.add("active");

}



/* ==================================================
   룰렛
================================================== */

const canvas =
  document.getElementById(
    "rouletteCanvas"
  );

const ctx =
  canvas.getContext("2d");

const pointer =
  document.getElementById(
    "pointer"
  );

const rouletteResult =
  document.getElementById(
    "rouletteResult"
  );

const spinButton =
  document.getElementById(
    "spinButton"
  );

const slotSelect =
  document.getElementById(
    "slotSelect"
  );


let SLOT_COUNT = 30;

let rotation = 0;

let velocity = 0;

let spinning = false;

let lastTime = 0;

let lastPeg = -1;


/* 색상 */

const rouletteColors = [
  "#f57676",
  "#3db98b",
  "#3383c3",
  "#ffbd55"
];


/* 캔버스 */

function resizeRoulette() {

  const size =
    canvas.clientWidth;

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    size * dpr;

  canvas.height =
    size * dpr;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  drawRoulette();
}


window.addEventListener(
  "resize",
  resizeRoulette
);


/* 룰렛 그리기 */

function drawRoulette() {

  const size =
    canvas.clientWidth;

  const cx =
    size / 2;

  const cy =
    size / 2;

  const radius =
    size * .42;

  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  /* 그림자 */

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius + 22,
    0,
    Math.PI * 2
  );

  ctx.shadowColor =
    "rgba(0,0,0,.7)";

  ctx.shadowBlur = 35;

  ctx.fillStyle = "#222";

  ctx.fill();

  ctx.restore();


  /* 외곽 금색 */

  const gold =
    ctx.createRadialGradient(
      cx,
      cy,
      radius * .5,
      cx,
      cy,
      radius + 20
    );

  gold.addColorStop(
    0,
    "#fff19a"
  );

  gold.addColorStop(
    .35,
    "#ffd02f"
  );

  gold.addColorStop(
    .7,
    "#d88600"
  );

  gold.addColorStop(
    1,
    "#ffcc36"
  );


  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius + 18,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = gold;

  ctx.fill();


  /* 칸 */

  const slice =
    Math.PI * 2 /
    SLOT_COUNT;


  for(
    let i = 0;
    i < SLOT_COUNT;
    i++
  ) {

    const start =
      rotation +
      i * slice -
      Math.PI / 2;

    const end =
      start + slice;


    ctx.beginPath();

    ctx.moveTo(
      cx,
      cy
    );

    ctx.arc(
      cx,
      cy,
      radius,
      start,
      end
    );

    ctx.closePath();


    ctx.fillStyle =
      rouletteColors[
        i % rouletteColors.length
      ];

    ctx.fill();


    ctx.strokeStyle =
      "rgba(255,255,255,.5)";

    ctx.lineWidth = 2;

    ctx.stroke();


    /* 숫자 */

    const angle =
      start + slice / 2;

    const textRadius =
      radius * .72;

    const x =
      cx +
      Math.cos(angle) *
      textRadius;

    const y =
      cy +
      Math.sin(angle) *
      textRadius;


    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.rotate(
      angle + Math.PI / 2
    );

    ctx.fillStyle =
      "white";

    ctx.font =
      `bold ${Math.max(
        12,
        size * .032
      )}px Arial`;

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.shadowColor =
      "rgba(0,0,0,.5)";

    ctx.shadowBlur = 4;

    ctx.fillText(
      i + 1,
      0,
      0
    );

    ctx.restore();
  }


  /* 중앙 */

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius * .21,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#d99329";

  ctx.fill();

  ctx.strokeStyle =
    "#ffe16b";

  ctx.lineWidth = 3;

  ctx.stroke();


  /* 중앙 버튼 */

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radius * .08,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ff6666";

  ctx.fill();

  ctx.strokeStyle =
    "#ffaaaa";

  ctx.lineWidth = 2;

  ctx.stroke();


  /* 바깥쪽 걸림쇠 */

  for(
    let i = 0;
    i < SLOT_COUNT;
    i++
  ) {

    const angle =
      rotation +
      i * slice -
      Math.PI / 2;

    const pegRadius =
      radius + 4;

    const px =
      cx +
      Math.cos(angle) *
      pegRadius;

    const py =
      cy +
      Math.sin(angle) *
      pegRadius;


    ctx.beginPath();

    ctx.arc(
      px,
      py,
      Math.max(
        5,
        size * .009
      ),
      0,
      Math.PI * 2
    );


    const peg =
      ctx.createRadialGradient(
        px - 2,
        py - 2,
        1,
        px,
        py,
        8
      );

    peg.addColorStop(
      0,
      "#ffffff"
    );

    peg.addColorStop(
      .5,
      "#eeeeee"
    );

    peg.addColorStop(
      1,
      "#999999"
    );


    ctx.fillStyle = peg;

    ctx.fill();

    ctx.strokeStyle =
      "rgba(80,50,20,.5)";

    ctx.stroke();
  }
}



/* 칸 변경 */

function changeSlots() {

  if(spinning) return;

  SLOT_COUNT =
    Number(slotSelect.value);

  rotation = 0;

  drawRoulette();

  rouletteResult.textContent =
    `${SLOT_COUNT}칸 룰렛 준비 완료!`;
}



/* 화살표 충돌 */

function pointerHit() {

  const power =
    Math.min(
      28,
      7 + Math.abs(velocity) * 500
    );

  const direction =
    Math.random() > .5
      ? 1
      : -1;

  const hit =
    direction * power;


  pointer.style.transform =
    `translateX(-50%) rotate(${hit}deg)`;


  setTimeout(() => {

    pointer.style.transform =
      `translateX(-50%) rotate(${
        -hit * .3
      }deg)`;

    setTimeout(() => {

      pointer.style.transform =
        "translateX(-50%) rotate(0deg)";

    }, 70);

  }, 65);
}



/* 충돌 확인 */

function checkCollision() {

  const slice =
    Math.PI * 2 /
    SLOT_COUNT;


  /*
     화살표는 위쪽.
  */

  const pointerAngle =
    Math.PI * 1.5;


  for(
    let i = 0;
    i < SLOT_COUNT;
    i++
  ) {

    const pegAngle =
      rotation +
      i * slice -
      Math.PI / 2;


    let difference =
      Math.abs(
        normalizeAngle(
          pegAngle -
          pointerAngle
        )
      );


    if(
      difference > Math.PI
    ) {

      difference =
        Math.PI * 2 -
        difference;
    }


    /*
       속도가 빠르면 넓게,
       느려지면 좁게.
    */

    const hitRange =
      .035 +
      Math.abs(velocity) * .4;


    if(
      difference < hitRange &&
      lastPeg !== i
    ) {

      lastPeg = i;

      pointerHit();

      break;
    }
  }
}



/* 각도 정리 */

function normalizeAngle(angle) {

  angle %=
    Math.PI * 2;

  if(angle < 0) {
    angle +=
      Math.PI * 2;
  }

  return angle;
}



/* 애니메이션 */

function animate(time) {

  if(!spinning) return;


  if(!lastTime) {
    lastTime = time;
  }


  const delta =
    Math.min(
      32,
      time - lastTime
    );

  lastTime = time;


  rotation +=
    velocity *
    delta /
    16;


  /*
     부드러운 감속.
  */

  velocity *=
    Math.pow(
      .985,
      delta / 16
    );


  checkCollision();

  drawRoulette();


  /*
     마지막에 아주 천천히.
  */

  if(
    Math.abs(velocity) <
    .0018
  ) {

    velocity = 0;

    spinning = false;

    finishRoulette();

    return;
  }


  requestAnimationFrame(
    animate
  );
}



/* 결과 */

function finishRoulette() {

  const slice =
    Math.PI * 2 /
    SLOT_COUNT;


  const pointerAngle =
    Math.PI * 1.5;


  let angle =
    normalizeAngle(
      pointerAngle -
      rotation +
      Math.PI / 2
    );


  let selected =
    Math.floor(
      angle / slice
    );


  selected %=
    SLOT_COUNT;


  rouletteResult.textContent =
    `🎉 ${selected + 1}번 칸에 멈췄다!`;


  spinButton.disabled =
    false;

  spinButton.textContent =
    "🎯 다시 돌리기";
}



/* 돌리기 */

function spinRoulette() {

  if(spinning) return;


  spinning = true;

  spinButton.disabled =
    true;

  spinButton.textContent =
    "🎰 돌아가는 중...";


  rouletteResult.textContent =
    "운명이 결정되고 있다...";


  /*
     시작 속도.
     숫자가 높을수록 빨라짐.
  */

  velocity =
    .035 +
    Math.random() * .012;


  lastTime = 0;

  lastPeg = -1;


  requestAnimationFrame(
    animate
  );
}



/* ==================================================
   순발력 게임
================================================== */

const reactionBox =
  document.getElementById(
    "reactionBox"
  );

const reactionResult =
  document.getElementById(
    "reactionResult"
  );

let reactionStart = 0;

let reactionTimer = null;

let reactionWaiting = false;


function startReaction() {

  reactionBox.className =
    "reaction-box ready";

  reactionBox.textContent =
    "기다려...";

  reactionResult.textContent =
    "";

  reactionWaiting = true;


  const wait =
    1500 +
    Math.random() * 3500;


  reactionTimer =
    setTimeout(() => {

      reactionBox.className =
        "reaction-box go";

      reactionBox.textContent =
        "🔥 지금!!!";

      reactionStart =
        performance.now();

      reactionWaiting =
        false;

    }, wait);
}


function reactionClick() {

  if(!reactionWaiting &&
     reactionStart > 0) {

    const time =
      performance.now() -
      reactionStart;

    reactionResult.textContent =
      `⚡ ${Math.round(time)}ms!`;

    reactionStart = 0;

    reactionBox.className =
      "reaction-box";

    reactionBox.textContent =
      "다시 도전해봐!";

    return;
  }


  if(reactionWaiting) {

    clearTimeout(
      reactionTimer
    );

    reactionWaiting = false;

    reactionStart = 0;

    reactionBox.className =
      "reaction-box";

    reactionBox.textContent =
      "너무 빨랐어! 😆";

    reactionResult.textContent =
      "신호가 나오기 전에 눌렀다!";

  }
}

const dice =
  document.getElementById(
    "dice"
  );

const diceResult =
  document.getElementById(
    "diceResult"
  );


const diceFaces = [
  "⚀",
  "⚁",
  "⚂",
  "⚃",
  "⚄",
  "⚅"
];


function rollDice() {

  dice.classList.add(
    "rolling"
  );

  diceResult.textContent =
    "굴러가는 중...";


  setTimeout(() => {

    dice.classList.remove(
      "rolling"
    );


    const number =
      Math.floor(
        Math.random() * 6
      );


    dice.textContent =
      diceFaces[number];


    diceResult.textContent =
      `🎉 ${number + 1}이 나왔다!`;

  }, 1000);
}
